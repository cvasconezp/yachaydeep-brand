# Al pushear a main, avisa a los repos consumidores para que sincronicen
# tokens y logos. Requiere el secret BRAND_SYNC_TOKEN: un PAT fine-grained
# con acceso a yachaydeep-web Y yachay-deep, permiso Contents: Read & Write.
name: Notificar consumidores

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # si un repo falla, igual avisar al otro
      matrix:
        repo:
          - cvasconezp/yachaydeep-web
          - cvasconezp/yachay-deep
    steps:
      - name: Disparar sync en ${{ matrix.repo }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.BRAND_SYNC_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ matrix.repo }}/dispatches \
            -d '{"event_type":"brand-updated"}' \
          && echo "✓ Aviso enviado a ${{ matrix.repo }}" \
          || { echo "::error::No se pudo avisar a ${{ matrix.repo }} — revisa permisos del BRAND_SYNC_TOKEN"; exit 1; }
